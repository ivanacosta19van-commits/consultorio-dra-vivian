<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Registro - Dra. Vivian</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Consultorio Médico - Dra. Vivian</h1>
      <nav>
        <a href="index.html">🔍 Buscar Paciente</a>
        <a href="agregar.html" class="active">➕ Nuevo Registro</a>
        <a href="lista.html">📋 Expedientes</a>
      </nav>
    </header>

    <section class="card">
      <h2>Registrar Nuevo Paciente</h2>
      <form id="patientForm">
        <div class="form-group">
          <label for="expediente">N° de Expediente:</label>
          <input type="text" id="expediente" placeholder="EJ: EXP-1001" required>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" placeholder="NOMBRE COMPLETO DEL PACIENTE" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="edad">Edad (Años):</label>
            <input type="number" id="edad" placeholder="EDAD" required>
          </div>

          <div class="form-group">
            <label for="genero">Género:</label>
            <select id="genero" required>
              <option value="">SELECCIONAR...</option>
              <option value="FEMENINO">FEMENINO</option>
              <option value="MASCULINO">MASCULINO</option>
              <option value="OTRO">OTRO</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="diagnostico">Observaciones / Diagnóstico (Opcional):</label>
          <textarea id="diagnostico" rows="4" placeholder="NOTAS CLÍNICAS, TRATAMIENTO O DIAGNÓSTICO..."></textarea>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Guardar Registro</button>
        </div>
      </form>
    </section>
  </div>

  <script type="module" src="script-agregar.js"></script>
</body>
</html>
